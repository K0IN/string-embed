[project]
name = "string-embed"
version = "0.1.0"
description = "Tiny string embedding model for database dedupe preselection."
readme = "README.md"
requires-python = ">=3.13"
keywords = ["dedupe", "embeddings", "entity-resolution", "record-linkage", "strings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=2.3.0",
    "torch>=2.9.0",
    "tqdm>=4.67.0",
]

[dependency-groups]
dev = [
    "build>=1.3.0",
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.0",
    "pyright>=1.1.407",
    "pytest>=8.4.0",
    "twine>=6.2.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["model", "testdata", "train"]

[tool.setuptools.packages.find]
include = ["string_embed*"]

[tool.setuptools.package-data]
string_embed = ["data/words_alpha.txt"]

[project]
name = "string-embed"
version = "0.1.0"
description = "Small convolutional string embedding model trained against edit-distance neighborhoods."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3.0",
    "torch>=2.9.0",
    "tqdm>=4.67.0",
]

[project.scripts]
string-embed = "cli:main"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.0",
    "pyright>=1.1.407",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "model", "testdata", "train"]
